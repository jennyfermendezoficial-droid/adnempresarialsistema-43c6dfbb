name: Patch entrega pagos 18ago

on:
  push:
    branches:
      - feature/entrega-pagos-informes-18ago

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entrega-pagos-informes-18ago
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar cambios mínimos de Pagos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: se esperaba 1 coincidencia, se encontraron {count}")
              p.write_text(text.replace(old, new, 1))

          pagos = "src/routes/_authenticated/pagos.tsx"
          replace_once(
              pagos,
              '<th className="text-left px-3 py-3 font-semibold">Tiempo clase</th>',
              '<th className="text-left px-3 py-3 font-semibold">Clases realizadas</th>',
          )
          replace_once(
              pagos,
              '''                    <div className="w-9 h-9 rounded-full grid place-items-center text-xs font-bold text-white" style={{ background: colorDe(s.id) }}>
                      {(s.nombre).slice(0,2).toUpperCase()}
                    </div>''',
              '''                    {profiles[s.id]?.avatar_url ? (
                      <img src={profiles[s.id]?.avatar_url ?? ""} alt={s.nombre} className="w-9 h-9 rounded-full object-cover border" />
                    ) : (
                      <div className="w-9 h-9 rounded-full grid place-items-center text-xs font-bold text-white" style={{ background: colorDe(s.id) }}>
                        {(s.nombre).slice(0,2).toUpperCase()}
                      </div>
                    )}''',
          )
          replace_once(
              pagos,
              '''                <td className="px-3 py-3">
                  {formatHM(s.minutosClase)}
                  {s.ajusteMin !== 0 && (
                    <span className="text-muted-foreground text-xs"> · ajuste {s.ajusteMin > 0 ? "+" : "−"}{formatHM(Math.abs(s.ajusteMin))}</span>
                  )}
                  <TarifaInput profesorId={s.id} campo="valor_hora_clase" valor={s.tarifaClase} mes={mes} anio={anio} puedeEditar={role === "admin"} onSaved={cargar} />
                </td>''',
              '''                <td className="px-3 py-3">
                  <div className="font-medium">
                    {s.items.filter((i) => i.tipo === "clase").length > 0
                      ? `${s.items.filter((i) => i.tipo === "clase").length} ${s.items.filter((i) => i.tipo === "clase").length === 1 ? "clase" : "clases"}`
                      : "—"}
                  </div>
                  {s.minutosClase > 0 && <div className="text-xs text-muted-foreground mt-0.5">{formatHM(s.minutosClase)}</div>}
                  {s.ajusteMin !== 0 && (
                    <div className="text-muted-foreground text-xs">Ajuste {s.ajusteMin > 0 ? "+" : "−"}{formatHM(Math.abs(s.ajusteMin))}</div>
                  )}
                  <TarifaInput profesorId={s.id} campo="valor_hora_clase" valor={s.tarifaClase} mes={mes} anio={anio} puedeEditar={role === "admin"} onSaved={cargar} />
                </td>''',
          )
          replace_once(
              pagos,
              '''                <td className="px-3 py-3">
                  {s.sesiones1a1} <span className="text-muted-foreground text-xs">· {formatHM(s.minutos1a1)}</span>
                  <TarifaInput profesorId={s.id} campo="valor_hora_sesion" valor={s.tarifaSesion} mes={mes} anio={anio} puedeEditar={role === "admin"} onSaved={cargar} />
                </td>''',
              '''                <td className="px-3 py-3">
                  <div className="font-medium">{s.sesiones1a1 > 0 ? `${s.sesiones1a1} ${s.sesiones1a1 === 1 ? "sesión" : "sesiones"}` : "—"}</div>
                  {s.minutos1a1 > 0 && <div className="text-xs text-muted-foreground mt-0.5">{formatHM(s.minutos1a1)}</div>}
                  <TarifaInput profesorId={s.id} campo="valor_hora_sesion" valor={s.tarifaSesion} mes={mes} anio={anio} puedeEditar={role === "admin"} onSaved={cargar} />
                </td>''',
          )

          abono = "src/components/pagos/RegistrarAbonoModal.tsx"
          replace_once(
              abono,
              '''export interface CuentaEmpresa {
  id: string; nombre: string; tipo: string; numero_cuenta: string; titular: string | null; activo: boolean;
}''',
              '''export interface CuentaEmpresa {
  id: string; nombre: string; tipo: string; numero_cuenta: string; titular: string | null; activo: boolean; logo_url?: string | null;
}
interface PerfilPago {
  id: string; nombre_completo: string; email: string; avatar_url: string | null; cedula: string | null;
  banco: string | null; tipo_cuenta: string | null; numero_cuenta: string | null;
  titular_cuenta: string | null; banco_logo_url: string | null;
}''',
          )
          replace_once(
              abono,
              '''  const [descMonto, setDescMonto] = useState("");
  const [descMotivo, setDescMotivo] = useState("");''',
              '''  const [descMonto, setDescMonto] = useState("");
  const [descMotivo, setDescMotivo] = useState("");
  const [profesor, setProfesor] = useState<PerfilPago | null>(null);''',
          )
          replace_once(
              abono,
              '''  const montoNum = Number(monto || 0);
  const coincide = montoNum > 0 && Math.abs(montoNum - saldo) < 0.01;''',
              '''  const montoNum = Number(monto || 0);
  const coincide = montoNum > 0 && Math.abs(montoNum - saldo) < 0.01;
  const cuentaOrigen = cuentas.find((c) => c.id === cuentaId) ?? null;''',
          )
          replace_once(
              abono,
              '''  useEffect(() => {
    const onPaste = (e: ClipboardEvent) => {''',
              '''  useEffect(() => {
    let cancel = false;
    void (async () => {
      const { data, error } = await supabase.rpc("perfiles_pagos", { _ids: [profesorId] });
      if (!cancel && !error) setProfesor(((data ?? [])[0] as PerfilPago | undefined) ?? null);
    })();
    return () => { cancel = true; };
  }, [profesorId]);

  useEffect(() => {
    const onPaste = (e: ClipboardEvent) => {''',
          )
          replace_once(
              abono,
              '''        <div className="grid md:grid-cols-2 gap-4 p-5">''',
              '''        <div className="grid md:grid-cols-2 gap-3 px-5 pt-5">
          <div className="rounded-xl border bg-muted/20 p-3">
            <div className="text-[10px] uppercase tracking-wider text-muted-foreground font-semibold mb-2">Destino · profesor</div>
            <div className="flex items-start gap-3">
              {profesor?.avatar_url ? (
                <img src={profesor.avatar_url} alt={profesor.nombre_completo || profesorNombre} className="w-12 h-12 rounded-full object-cover border" />
              ) : (
                <div className="w-12 h-12 rounded-full grid place-items-center bg-violet-gradient text-white font-bold">{profesorNombre.slice(0, 2).toUpperCase()}</div>
              )}
              <div className="min-w-0 flex-1">
                <div className="font-semibold truncate">{profesor?.nombre_completo || profesorNombre}</div>
                {profesor?.cedula && <div className="text-xs text-muted-foreground">Cédula {profesor.cedula}</div>}
                {profesor?.banco ? (
                  <div className="mt-2 flex items-start gap-2 text-xs">
                    {profesor.banco_logo_url ? <img src={profesor.banco_logo_url} alt="" className="w-6 h-6 rounded object-cover" /> : <Landmark className="w-4 h-4 mt-0.5 text-muted-foreground" />}
                    <div>
                      <div className="font-medium">{profesor.banco}</div>
                      <div className="text-muted-foreground capitalize">{profesor.tipo_cuenta || "Cuenta"}{profesor.numero_cuenta ? ` · N° ${profesor.numero_cuenta}` : ""}</div>
                      {profesor.titular_cuenta && <div className="text-muted-foreground">Titular: {profesor.titular_cuenta}</div>}
                    </div>
                  </div>
                ) : <div className="text-xs text-amber-600 mt-2">Sin cuenta bancaria registrada.</div>}
              </div>
            </div>
          </div>

          <div className="rounded-xl border bg-muted/20 p-3">
            <div className="text-[10px] uppercase tracking-wider text-muted-foreground font-semibold mb-2">Origen · empresa</div>
            {cuentaOrigen ? (
              <div className="flex items-start gap-3">
                {cuentaOrigen.logo_url ? <img src={cuentaOrigen.logo_url} alt="" className="w-12 h-12 rounded-xl object-cover border" /> : <div className="w-12 h-12 rounded-xl bg-muted grid place-items-center"><Landmark className="w-5 h-5" /></div>}
                <div className="min-w-0">
                  <div className="font-semibold truncate">{cuentaOrigen.nombre}</div>
                  <div className="text-xs text-muted-foreground capitalize">{cuentaOrigen.tipo} · N° {cuentaOrigen.numero_cuenta}</div>
                  {cuentaOrigen.titular && <div className="text-xs text-muted-foreground">Titular: {cuentaOrigen.titular}</div>}
                </div>
              </div>
            ) : <div className="text-xs text-muted-foreground">Selecciona abajo la cuenta desde la que se realiza el pago.</div>}
          </div>
        </div>

        <div className="grid md:grid-cols-2 gap-4 p-5">''',
          )

          cuentas = "src/components/pagos/PagosCuentas.tsx"
          replace_once(
              cuentas,
              '''import { Landmark, Pencil, Plus, Trash2 } from "lucide-react";''',
              '''import { ImagePlus, Landmark, Loader2, Pencil, Plus, Trash2 } from "lucide-react";''',
          )
          replace_once(
              cuentas,
              '''import type { CuentaEmpresa } from "./RegistrarAbonoModal";''',
              '''import type { CuentaEmpresa } from "./RegistrarAbonoModal";
import { subirImagen } from "@/lib/cloudinary";''',
          )
          replace_once(
              cuentas,
              '''            <div className="w-10 h-10 rounded-xl grid place-items-center bg-muted"><Landmark className="w-5 h-5" /></div>''',
              '''            {c.logo_url
              ? <img src={c.logo_url} alt={c.nombre} className="w-10 h-10 rounded-xl object-cover border" />
              : <div className="w-10 h-10 rounded-xl grid place-items-center bg-muted"><Landmark className="w-5 h-5" /></div>}''',
          )
          replace_once(
              cuentas,
              '''  const [titular, setTitular] = useState(cuenta?.titular ?? "");
  const [guardando, setGuardando] = useState(false);''',
              '''  const [titular, setTitular] = useState(cuenta?.titular ?? "");
  const [logoUrl, setLogoUrl] = useState(cuenta?.logo_url ?? "");
  const [guardando, setGuardando] = useState(false);
  const [subiendoLogo, setSubiendoLogo] = useState(false);

  const subirLogo = async (file: File) => {
    if (!file.type.startsWith("image/")) return toast.error("Selecciona una imagen para el logo");
    setSubiendoLogo(true);
    try {
      const url = await subirImagen(file, "adn/bancos");
      setLogoUrl(url);
      toast.success("Logo cargado");
    } catch (err) {
      toast.error((err as Error).message);
    } finally {
      setSubiendoLogo(false);
    }
  };''',
          )
          replace_once(
              cuentas,
              '''    if (!nombre.trim() || !numero.trim()) return toast.error("Completa banco y número de cuenta");
    setGuardando(true);
    const payload = { nombre: nombre.trim(), tipo, numero_cuenta: numero.trim(), titular: titular.trim() || null, activo: true };''',
              '''    if (!nombre.trim() || !numero.trim() || !titular.trim()) return toast.error("Completa banco, número de cuenta y titular");
    setGuardando(true);
    const payload = { nombre: nombre.trim(), tipo, numero_cuenta: numero.trim(), titular: titular.trim(), logo_url: logoUrl || null, activo: true };''',
          )
          replace_once(
              cuentas,
              '''        <h3 className="text-lg font-semibold">{cuenta ? "Editar cuenta" : "Nueva cuenta"}</h3>
        <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Banco o cooperativa" className="w-full px-3 py-2 rounded-lg border bg-background text-sm" />''',
              '''        <h3 className="text-lg font-semibold">{cuenta ? "Editar cuenta" : "Nueva cuenta"}</h3>
        <div className="flex items-center gap-3 rounded-xl border p-3">
          {logoUrl
            ? <img src={logoUrl} alt="Logo del banco" className="w-14 h-14 rounded-xl object-cover border" />
            : <div className="w-14 h-14 rounded-xl bg-muted grid place-items-center"><Landmark className="w-6 h-6" /></div>}
          <div>
            <label className="px-3 py-2 rounded-lg border cursor-pointer text-sm inline-flex items-center gap-2 hover:bg-muted">
              {subiendoLogo ? <Loader2 className="w-4 h-4 animate-spin" /> : <ImagePlus className="w-4 h-4" />}
              {subiendoLogo ? "Subiendo…" : logoUrl ? "Cambiar logo" : "Subir logo / imagen"}
              <input type="file" accept="image/*" hidden onChange={(e) => e.target.files?.[0] && void subirLogo(e.target.files[0])} />
            </label>
            <div className="text-[11px] text-muted-foreground mt-1">Opcional. Se mostrará al elegir la cuenta de origen.</div>
          </div>
        </div>
        <input value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Banco o cooperativa" className="w-full px-3 py-2 rounded-lg border bg-background text-sm" />''',
          )
          replace_once(
              cuentas,
              '''        <input value={titular} onChange={(e) => setTitular(e.target.value)} placeholder="Titular (opcional)" className="w-full px-3 py-2 rounded-lg border bg-background text-sm" />''',
              '''        <input value={titular} onChange={(e) => setTitular(e.target.value)} placeholder="Titular de la cuenta" className="w-full px-3 py-2 rounded-lg border bg-background text-sm" />''',
          )
          replace_once(
              cuentas,
              '''          <button onClick={guardar} disabled={guardando} className="px-4 py-2 rounded-lg bg-violet-gradient text-white text-sm font-semibold disabled:opacity-60">{guardando ? "Guardando…" : "Guardar"}</button>''',
              '''          <button onClick={guardar} disabled={guardando || subiendoLogo} className="px-4 py-2 rounded-lg bg-violet-gradient text-white text-sm font-semibold disabled:opacity-60">{guardando ? "Guardando…" : "Guardar"}</button>''',
          )
          PY

      - name: Verificar alcance del cambio
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          expected = {
              "src/routes/_authenticated/pagos.tsx",
              "src/components/pagos/RegistrarAbonoModal.tsx",
              "src/components/pagos/PagosCuentas.tsx",
          }
          if changed != expected:
              raise SystemExit(f"Archivos inesperados. Cambiados={sorted(changed)} esperados={sorted(expected)}")
          print("Alcance correcto:", *sorted(changed), sep="\n- ")
          PY

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build

      - name: Guardar cambios verificados y retirar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-entrega-pagos-18ago.yml
          git add src/routes/_authenticated/pagos.tsx src/components/pagos/RegistrarAbonoModal.tsx src/components/pagos/PagosCuentas.tsx
          git commit -m "Pagos: completa resumen, cuentas y destino del profesor"
          git push origin HEAD:feature/entrega-pagos-informes-18ago
